
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a10">
<meta name="description" content="Fabian Belgrave, Creative Director at LUZ NEGRO PRODUCTION, Barbados.">
<title>Fabian Belgrave | LUZ NEGRO PRODUCTION</title>

<style>
:root {
  --orange: #ff791f;
  --navy: #111c35;
  --black: #080a10;
  --white: #f8f9fc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--white);
  background:
    radial-gradient(circle at 50% 10%, #253c62, transparent 48%),
    linear-gradient(145deg, #080a10, #101a30);
}

.page {
  max-width: 470px;
  margin: 0 auto;
  padding: 30px 18px 45px;
}

.card {
  background: #111827;
  border: 1px solid #34415b;
  border-radius: 24px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
  display: block;
  width: 175px;
  max-width: 75%;
  margin: 0 auto 22px;
}

.portrait {
  display: block;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 25%;
  border: 4px solid var(--orange);
  margin: 0 auto 22px;
  box-shadow: 0 0 35px rgba(255,121,31,.18);
}

h1 {
  font-size: 30px;
  margin: 0 0 7px;
  line-height: 1.2;
}

.role {
  color: var(--orange);
  font-weight: bold;
  font-size: 17px;
  margin: 0 0 10px;
}

.company {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin: 0 0 5px;
}

.location {
  color: #aebbd0;
  font-size: 14px;
  margin: 0;
}

.divider {
  height: 1px;
  background: #34415b;
  margin: 25px 0;
}

.tagline {
  color: #d0d7e4;
  font-size: 15px;
  font-style: italic;
  line-height: 1.7;
  margin: 0 0 24px;
}

.actions {
  display: grid;
  gap: 12px;
}

.button {
  display: block;
  padding: 15px 18px;
  border-radius: 10px;
  background: #223452;
  border: 1px solid #405170;
  color: white;
  font-weight: bold;
  text-decoration: none;
  transition: transform .2s, background .2s;
}

.button:hover {
  transform: translateY(-2px);
  background: #2c4265;
}

.button.primary {
  background: var(--orange);
  color: #111;
  border-color: var(--orange);
}

.button.save {
  background: transparent;
  border: 2px solid var(--orange);
  color: var(--orange);
}

.phone {
  color: #cbd5e1;
  margin: 22px 0 0;
  font-size: 14px;
}

.footer {
  text-align: center;
  color: #8f9aae;
  font-size: 12px;
  margin-top: 25px;
}

@media (max-width: 400px) {
  .card { padding: 25px 17px; }
  h1 { font-size: 27px; }
}
</style>
</head>

<body>
<main class="page">
  <article class="card">

    <img
      class="logo"
      src="https://i.postimg.cc/TwKpbDhH/Luz-Negro-Production-logo-with-drone-copy.png"
      alt="LUZ NEGRO PRODUCTION logo"
    >

    <img
      class="portrait"
      src="https://i.postimg.cc/MKtz6r3j/Fabian-Belgrave-Comms-Officer.jpg"
      alt="Portrait of Fabian Belgrave"
    >

    <h1>Fabian Belgrave</h1>
    <p class="role">Creative Director</p>
    <p class="company">LUZ NEGRO PRODUCTION</p>
    <p class="location">Barbados</p>

    <div class="divider"></div>

    <p class="tagline">
      Lighting the Darkness.<br>
      Capturing the Moments.
    </p>

    <div class="actions">

      <a
        class="button primary"
        href="https://wa.me/12468503372?text=Hello%20Fabian%2C%20I%20would%20like%20to%20make%20an%20enquiry."
        target="_blank"
        rel="noopener noreferrer"
      >
        Chat on WhatsApp
      </a>

      <a
        class="button"
        href="https://fabie13.github.io/Luz-Negro-Production/"
        target="_blank"
        rel="noopener noreferrer"
      >
        View My Portfolio
      </a>

      <a
        class="button"
        href="https://www.instagram.com/luznegropro_fx/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Follow on Instagram
      </a>

      <a
        class="button save"
        id="saveContact"
        href="#"
      >
        Save My Contact
      </a>

    </div>

    <p class="phone">+1 (246) 850-3372</p>

  </article>

  <p class="footer">
    © 2026 LUZ NEGRO PRODUCTION · Barbados
  </p>
</main>

<script>
document.getElementById("saveContact").addEventListener("click", function(event) {
  event.preventDefault();

  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Belgrave;Fabian;;;",
    "FN:Fabian Belgrave",
    "ORG:LUZ NEGRO PRODUCTION",
    "TITLE:Creative Director",
    "TEL;TYPE=CELL:+12468503372",
    "URL:https://fabie13.github.io/Luz-Negro-Production/",
    "X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/luznegropro_fx/",
    "NOTE:Lighting the Darkness. Capturing the Moments.",
    "END:VCARD"
  ].join("\r\n");

  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Fabian_Belgrave_LUZ_NEGRO.vcf";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>

</body>
</html>
